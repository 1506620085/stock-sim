[program:postgres]
command=/bin/bash -c "exec gosu postgres /usr/lib/postgresql/$(ls /usr/lib/postgresql | head -1)/bin/postgres -D /var/lib/postgresql/data -c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql"
user=root
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:minio]
command=/usr/local/bin/minio server /data --address :9000 --console-address :9001
user=root
directory=/data
autostart=true
autorestart=true
priority=20
environment=HOME="/root"
stdout_logfile=/var/log/supervisor/minio.log
stderr_logfile=/var/log/supervisor/minio.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:api]
command=/start-api.sh
user=root
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=8
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
