  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: stock-sim-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stock_sim}:${POSTGRES_PASSWORD:-stock_sim}@postgres:5432/${POSTGRES_DB:-stock_sim}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-akshare}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-stock-review}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   minio:
    #     condition: service_started
    # 调试时可放开；日常访问走 web:8080 的 /api 反代即可
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - default
      - shared
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: stock-sim-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  stock_sim_postgres_data:
  stock_sim_minio_data:

networks:
  shared:
    external: true
    name: stock-sim-shared
